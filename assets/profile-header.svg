<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="318" viewBox="0 0 1040 318" role="img" aria-labelledby="title desc">
  <title id="title">Ayrz — Backend engineering</title>
  <desc id="desc">Systems behind the product. Dephts Studio. An original vector banner with a quiet service architecture diagram.</desc>
