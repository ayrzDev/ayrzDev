    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#91a0b8" stroke-opacity=".045"/></pattern>
    <clipPath id="clip"><rect width="1040" height="318" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
