name: Update GitHub stats

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and render live stats
        run: python3 scripts/update_stats.py
      - name: Commit changed cards
        run: |
          if git diff --quiet -- assets/stats-*.svg; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg
          git commit -m "Update GitHub stats"
          git push
